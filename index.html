<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Curling Push</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#000; }
  body {
    font-family:'Special Elite', monospace;
    color:#9a9f9f;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #wrap {
    position:fixed; inset:0; display:flex; flex-direction:column;
    padding-top:max(env(safe-area-inset-top, 0px), 52px);
    padding-bottom:env(safe-area-inset-bottom);
  }
  #field { flex:1; position:relative; margin:8px; border:2px solid rgba(255,255,255,0.7); border-radius:6px; overflow:hidden; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #info {
    height:54px; display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; font-size:15px; letter-spacing:0.1em;
  }
  #log { color:#46ff7d; }
</style>
</head>
<body>
<div id="wrap">
  <div id="field"><canvas id="game"></canvas></div>
  <div id="info">
    <div id="log">하우스에서 내려오는 중...</div>
    <div id="dist" style="color:#9a9f9f"></div>
  </div>
</div>

<script>
(function(){
  const canvas=document.getElementById('game');
  const ctx=canvas.getContext('2d');
  const fieldEl=document.getElementById('field');
  const logEl=document.getElementById('log');
  const distEl=document.getElementById('dist');

  // ── 화면/월드 ──
  let W=0,H=0,DPR=1;
  let WORLD_H=0;                 // 빙판 전체 길이 (화면의 LANE_SCREENS배)
  const LANE_SCREENS=3;
  let camY=0;                    // 카메라 (월드 기준 화면 위쪽 y)

  let house={x:0,y:0,r1:0,r2:0,r3:0};
  let backLine=0;
  let startY=0;

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    const r=fieldEl.getBoundingClientRect();
    W=r.width; H=r.height;
    canvas.width=W*DPR; canvas.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    WORLD_H=H*LANE_SCREENS;
    house.x=W/2;
    house.y=H*0.42;              // 월드 맨 위쪽 화면 안
    house.r3=Math.min(W,H)*0.07;
    house.r2=house.r3*2.3;
    house.r1=house.r3*3.8;
    backLine=H*0.12;
    startY=WORLD_H-H*0.16;
  }
  window.addEventListener('resize',resize);

  // ── 상태 ──
  // intro: 하우스→출발점 카메라 팬 / ready: 밀 수 있음 / sliding: 퍽 추적 / linger: 결과 잠깐 보여줌
  let mode='intro';
  let modeT=0;
  let throwsCount=0;

  // ── 퍽 ──
  const PUCK_R_RATIO=0.095;      // 더 크게
  let puck=null;
  let stones=[];

  function newPuck(){
    puck={
      x:W/2, y:startY,
      vx:0, vy:0,
      r:Math.min(W,H)*PUCK_R_RATIO,
      color:'#2ee6e6',
      held:false, thrown:false, pid:null
    };
  }

  // ── 사운드 ──
  let audioCtx=null;
  function sound(freq,dur,vol,type){
    try{
      if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type=type||'sine';
      o.frequency.setValueAtTime(freq,audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(Math.max(50,freq*0.5),audioCtx.currentTime+dur);
      g.gain.setValueAtTime(vol,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
      o.connect(g);g.connect(audioCtx.destination);
      o.start();o.stop(audioCtx.currentTime+dur+0.02);
    }catch(e){}
  }

  // ── 입력 (월드 좌표로 변환) ──
  let samples=[];
  function worldPos(e){
    const r=fieldEl.getBoundingClientRect();
    return {x:e.clientX-r.left, y:e.clientY-r.top+camY, t:performance.now()};
  }

  fieldEl.addEventListener('pointerdown', e=>{
    if(mode!=='ready' || !puck || puck.thrown) return;
    const p=worldPos(e);
    const d=Math.hypot(p.x-puck.x, p.y-puck.y);
    if(d < puck.r*2.4){
      puck.held=true;
      puck.pid=e.pointerId;
      samples=[p];
      sound(180,0.06,0.08);
    }
  });

  fieldEl.addEventListener('pointermove', e=>{
    if(!puck || !puck.held || e.pointerId!==puck.pid) return;
    const p=worldPos(e);
    puck.x=p.x; puck.y=p.y;
    samples.push(p);
    if(samples.length>6) samples.shift();
  });

  function release(e){
    if(!puck || !puck.held || (e && e.pointerId!==puck.pid)) return;
    puck.held=false;
    if(samples.length>=2){
      const a=samples[0], b=samples[samples.length-1];
      const dt=Math.max(8, b.t-a.t);
      const k=16.7/dt;
      const HEAVY=0.55;           // 무거운 퍽: 손 속도의 일부만 전달됨
      puck.vx=(b.x-a.x)*k*HEAVY;
      puck.vy=(b.y-a.y)*k*HEAVY;
    }
    const sp=Math.hypot(puck.vx,puck.vy);
    if(sp>0.8){
      puck.thrown=true;
      throwsCount++;
      mode='sliding';
      logEl.textContent='던지기 #'+throwsCount+'  속도 '+sp.toFixed(1);
      sound(240+Math.min(sp,40)*8, 0.15, 0.18);
    }else{
      puck.vx=0; puck.vy=0;
    }
    samples=[];
  }
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);

  // ── 물리 ──
  function step(){
    if(mode==='sliding' && puck && puck.thrown){
      puck.x+=puck.vx; puck.y+=puck.vy;
      const sp=Math.hypot(puck.vx,puck.vy);
      if(sp>0){
        const ns=Math.max(0, sp*0.9935-0.018);   // 무거운 퍽: 마찰도 묵직하게
        if(ns<0.05){ puck.vx=0; puck.vy=0; stopPuck(); }
        else { puck.vx=puck.vx/sp*ns; puck.vy=puck.vy/sp*ns; }
      }
      if(!puck) return;

      // 옆으로 빠지면 죽음 (볼링 거터)
      if(puck.x < -puck.r*0.2 || puck.x > W+puck.r*0.2){
        gutter();
        return;
      }
      // 백라인 넘으면 OVER
      if(puck.y - puck.r < backLine){
        over();
        return;
      }
      // 아래로 후진하면 그냥 멈춤 취급
      if(puck.y > WORLD_H - puck.r){ puck.y=WORLD_H-puck.r; puck.vy=0; }

      // 남아있는 퍽들과 충돌
      for(const s of stones){
        const dx=s.x-puck.x, dy=s.y-puck.y;
        const dist=Math.hypot(dx,dy), minD=s.r+puck.r;
        if(dist<minD && dist>0.0001){
          const nx=dx/dist, ny=dy/dist;
          const overlap=(minD-dist)/2;
          puck.x-=nx*overlap; puck.y-=ny*overlap;
          s.x+=nx*overlap; s.y+=ny*overlap;
          const rel=(s.vx-puck.vx)*nx+(s.vy-puck.vy)*ny;
          if(rel<0){
            const jval=rel*0.95;
            puck.vx+=jval*nx; puck.vy+=jval*ny;
            s.vx-=jval*nx; s.vy-=jval*ny;
            sound(420,0.08,0.12,'triangle');
          }
        }
      }
    }

    // 남은 퍽들의 미끄러짐
    for(const s of stones){
      if(s.vx||s.vy){
        s.x+=s.vx; s.y+=s.vy;
        const sp=Math.hypot(s.vx,s.vy);
        const ns=Math.max(0, sp*0.9935-0.018);
        if(ns<0.05){ s.vx=0; s.vy=0; }
        else { s.vx=s.vx/sp*ns; s.vy=s.vy/sp*ns; }
        if(s.x<-s.r || s.x>W+s.r) s.dead=true;          // 옆으로 빠짐
        if(s.y-s.r<backLine) s.dead=true;               // 밀려서 백라인 넘음
        if(s.y>WORLD_H-s.r){ s.y=WORLD_H-s.r; s.vy=0; }
      }
    }
    stones=stones.filter(s=>!s.dead);
  }

  function stopPuck(){
    const d=Math.hypot(puck.x-house.x, puck.y-house.y);
    let msg='정지';
    if(d<=house.r3) msg='정지!  ★ 버튼 정중앙!';
    else if(d<=house.r2) msg='정지!  하우스 안쪽';
    else if(d<=house.r1) msg='정지!  하우스 진입';
    logEl.textContent=msg;
    distEl.textContent='중심까지 '+Math.round(d)+'px';
    sound(d<=house.r1? 600: 260, 0.2, 0.15);
    stones.push({x:puck.x,y:puck.y,vx:0,vy:0,r:puck.r,color:puck.color});
    if(stones.length>10) stones.shift();
    puck=null;
    linger();
  }

  function gutter(){
    logEl.textContent='옆으로 빠졌습니다!';
    distEl.textContent='';
    sound(150,0.25,0.15,'sawtooth');
    puck=null;
    linger();
  }

  function over(){
    logEl.textContent='OVER!  너무 셉니다';
    distEl.textContent='';
    sound(140,0.3,0.15,'sawtooth');
    puck=null;
    linger();
  }

  function linger(){
    mode='linger';
    modeT=performance.now();
  }

  // ── 카메라 ──
  function easeInOut(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
  let panFrom=0;

  function updateCamera(){
    const maxCam=WORLD_H-H;
    if(mode==='intro'){
      // 하우스(또는 현재 위치)에서 출발점으로 멋있게 팬
      const t=Math.min(1,(performance.now()-modeT)/2000);
      camY=panFrom+(maxCam-panFrom)*easeInOut(t);
      if(t>=1){
        mode='ready';
        newPuck();
        logEl.textContent='퍽을 밀어 보세요';
        distEl.textContent='';
      }
    }else if(mode==='ready'){
      camY=maxCam;
    }else if(mode==='sliding' && puck){
      const target=Math.max(0, Math.min(maxCam, puck.y - H*0.45));
      camY += (target-camY)*0.18;   // 부드러운 추적
    }else if(mode==='linger'){
      if(performance.now()-modeT>900){
        mode='intro';
        modeT=performance.now();
        panFrom=camY;               // 멈춘 지점에서 출발점으로 내려오는 팬
        logEl.textContent='하우스에서 내려오는 중...';
      }
    }
  }

  // ── 그리기 (월드 좌표 → 카메라 변환) ──
  function draw(){
    ctx.fillStyle='#050505';
    ctx.fillRect(0,0,W,H);

    ctx.save();
    ctx.translate(0,-camY);

    // 모눈 (보이는 영역만)
    const top=camY, bot=camY+H;
    ctx.strokeStyle='rgba(255,255,255,0.05)';
    ctx.lineWidth=1;
    ctx.beginPath();
    for(let x=0;x<=W;x+=18){ctx.moveTo(x,top);ctx.lineTo(x,bot);}
    for(let y=Math.floor(top/18)*18;y<=bot;y+=18){ctx.moveTo(0,y);ctx.lineTo(W,y);}
    ctx.stroke();

    // 양옆 거터 라인 (빠지면 죽는 경계)
    ctx.strokeStyle='rgba(255,64,64,0.35)';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(2,top); ctx.lineTo(2,bot);
    ctx.moveTo(W-2,top); ctx.lineTo(W-2,bot);
    ctx.stroke();

    // 중앙선 (빙판 전체)
    ctx.save();
    ctx.strokeStyle='rgba(232,234,234,0.13)';
    ctx.setLineDash([4,14]);
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(W/2,top); ctx.lineTo(W/2,bot); ctx.stroke();
    ctx.restore();

    // 거리 표시선: 반 화면마다 가로선 + 거리 숫자 (인트로/활주 때 빙판이 보이게)
    ctx.save();
    ctx.strokeStyle='rgba(232,234,234,0.12)';
    ctx.fillStyle='rgba(232,234,234,0.3)';
    ctx.lineWidth=1.5;
    ctx.font=Math.min(W*0.045,17)+'px "Special Elite", monospace';
    ctx.textAlign='left';
    const seg=H*0.5;
    for(let y=startY-seg; y>backLine; y-=seg){
      ctx.beginPath(); ctx.moveTo(W*0.06,y); ctx.lineTo(W*0.94,y); ctx.stroke();
      const meters=Math.round((startY-y)/seg)*5;   // 반 화면 = 5m
      ctx.fillText(meters+'m', W*0.06, y-7);
    }
    ctx.restore();

    // 하우스
    ctx.save();
    ctx.lineWidth=2.5;
    ctx.shadowBlur=10;
    ctx.shadowColor='#ff4040';
    ctx.strokeStyle='rgba(255,64,64,0.85)';
    ctx.beginPath(); ctx.arc(house.x,house.y,house.r1,0,Math.PI*2); ctx.stroke();
    ctx.shadowColor='#e8eaea';
    ctx.strokeStyle='rgba(232,234,234,0.85)';
    ctx.beginPath(); ctx.arc(house.x,house.y,house.r2,0,Math.PI*2); ctx.stroke();
    ctx.shadowColor='#5a9bff';
    ctx.strokeStyle='rgba(90,155,255,0.95)';
    ctx.beginPath(); ctx.arc(house.x,house.y,house.r3,0,Math.PI*2); ctx.stroke();
    ctx.restore();

    // 백라인
    ctx.save();
    ctx.strokeStyle='rgba(255,64,64,0.6)';
    ctx.setLineDash([8,8]);
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,backLine); ctx.lineTo(W,backLine); ctx.stroke();
    ctx.restore();

    // 조준 점 (볼링 레인 가이드)
    ctx.save();
    ctx.fillStyle='rgba(232,234,234,0.45)';
    for(let i=1;i<=7;i++){
      const gy=startY - i*H*0.09;
      ctx.beginPath();
      ctx.arc(W/2, gy, 3.2, 0, Math.PI*2);
      ctx.fill();
    }
    for(const ox of [-W*0.18, W*0.18]){
      ctx.beginPath();
      ctx.arc(W/2+ox, startY-H*0.27, 2.6, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();

    // 남은 퍽들
    for(const s of stones) drawStone(s, 0.75, false);
    // 현재 퍽
    if(puck) drawStone(puck, 1, puck.held);

    ctx.restore();

    updateCamera();
    step();
    requestAnimationFrame(draw);
  }

  function drawStone(s, alpha, held){
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.shadowColor=s.color;
    ctx.shadowBlur=held?20:12;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.85)';
    ctx.fill();
    ctx.lineWidth=held?4:3;
    ctx.strokeStyle=s.color;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r*0.35,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  resize();
  mode='intro';
  modeT=performance.now();
  panFrom=0;
  camY=0;
  draw();
})();
</script>
</body>
</html>
